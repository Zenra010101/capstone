# Local/dev stack — extend for DigitalOcean production later
services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5170:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=gensanpos;Username=postgres;Password=postgres"
      Jwt__Secret: ${JWT_SECRET:-ChangeMe-In-Production-Min-32-Chars!!}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gensanpos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
  # frontend:
  #   build: ./frontend
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     NEXT_PUBLIC_API_URL: http://localhost:5170

volumes:
  pgdata:
